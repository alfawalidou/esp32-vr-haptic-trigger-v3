[platformio]
default_envs = trigger-v3-safe

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Keep the current two-slot layout during prototype tests to avoid another
; partition-table migration. Re-evaluate the layout only in a later explicit phase.
board_build.partitions = min_spiffs.csv
lib_deps =
    fastled/FastLED@3.10.3
    adafruit/Adafruit SSD1306@2.5.16
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:trigger-v3-safe]
build_flags =
    ${env.build_flags}
    -DTRIGGER_V3_ACTUATORS_ENABLED=0

[env:trigger-v3-compat]
build_flags =
    ${env.build_flags}
    -DTRIGGER_V3_ACTUATORS_ENABLED=1
