<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>
  .title{font:700 34px sans-serif;fill:#102b4e}.sub{font:20px sans-serif;fill:#555}.h{font:700 22px sans-serif;fill:#fff}.t{font:18px monospace;fill:#111}.small{font:16px sans-serif;fill:#333}.warn{font:700 18px sans-serif;fill:#8a4b00}
  .blue{fill:#1768ac}.green{fill:#23864a}.orange{fill:#d56a14}.black{fill:#333}.red{fill:#bd3030}.panel{fill:#f7fafc;stroke:#8aa6c1;stroke-width:2}.screw{fill:#d7e2ef;stroke:#315b86;stroke-width:2}
</style>
<rect width="1500" height="980" fill="white"/>
<text x="50" y="55" class="title">ESP32 DIY Shield — mapping corrigé des borniers</text>
<text x="50" y="88" class="sub">Orientation : USB en bas • le bornier est décalé par rapport aux pins visibles de l'ESP32</text>

<rect x="390" y="155" width="720" height="480" rx="24" fill="#202733" stroke="#557" stroke-width="4"/>
<text x="650" y="360" font-family="sans-serif" font-weight="700" font-size="42" fill="white">ESP32 DEVKIT</text>
<text x="690" y="405" font-family="sans-serif" font-size="24" fill="#cfd7e3">USB en bas</text>
<rect x="675" y="565" width="150" height="55" rx="10" fill="#888"/><text x="714" y="601" font-family="sans-serif" font-weight="700" font-size="20" fill="white">USB</text>

<!-- top row -->
<text x="390" y="125" font-family="sans-serif" font-weight="700" font-size="20" fill="#1768ac">RANGÉE HAUTE — gauche → droite</text>
<g transform="translate(300,135)">
  <rect width="900" height="85" rx="12" class="panel"/>
  <g class="t">
    <text x="20" y="32">1 D35</text><text x="20" y="58">GPIO35</text>
    <text x="110" y="32">2 D34</text><text x="110" y="58">GPIO34</text>
    <text x="200" y="32">3 VN</text><text x="200" y="58">GPIO39</text>
    <text x="290" y="32">4 VP</text><text x="290" y="58">GPIO36</text>
    <text x="380" y="45">5 EN</text>
    <text x="460" y="32">6 D23</text><text x="460" y="58">GPIO23</text>
    <text x="550" y="32">7 D22</text><text x="550" y="58">GPIO22</text>
    <text x="640" y="32">8 TX0</text><text x="640" y="58">GPIO1</text>
    <text x="730" y="32">9 RX0</text><text x="730" y="58">GPIO3</text>
    <text x="810" y="32">10 D21</text><text x="810" y="58">GPIO21</text>
  </g>
</g>

<!-- left -->
<rect x="35" y="180" width="300" height="600" rx="16" class="panel"/>
<rect x="35" y="180" width="300" height="48" rx="16" class="green"/><text x="58" y="212" class="h">CÔTÉ GAUCHE — haut → bas</text>
<g class="t">
<text x="65" y="265">1  D32 / GPIO32</text><text x="65" y="315">2  D33 / GPIO33</text><text x="65" y="365">3  D25 / GPIO25</text><text x="65" y="415">4  D26 / GPIO26</text><text x="65" y="465">5  D27 / GPIO27</text><text x="65" y="515">6  D14 / GPIO14</text><text x="65" y="565">7  D12 / GPIO12</text><text x="65" y="615">8  D13 / GPIO13</text><text x="65" y="665">9  GND</text><text x="65" y="715">10 VIN / 5V</text>
</g>

<!-- right -->
<rect x="1165" y="180" width="300" height="600" rx="16" class="panel"/>
<rect x="1165" y="180" width="300" height="48" rx="16" class="orange"/><text x="1188" y="212" class="h">CÔTÉ DROIT — haut → bas</text>
<g class="t">
<text x="1195" y="265">1  D19 / GPIO19</text><text x="1195" y="315">2  D18 / GPIO18</text><text x="1195" y="365">3  D5 / GPIO5</text><text x="1195" y="415">4  TX2 / GPIO17</text><text x="1195" y="465">5  RX2 / GPIO16</text><text x="1195" y="515">6  D4 / GPIO4</text><text x="1195" y="565">7  D2 / GPIO2</text><text x="1195" y="615">8  D15 / GPIO15</text><text x="1195" y="665">9  GND</text><text x="1195" y="715">10 3V3</text>
</g>

<!-- used pins -->
<rect x="360" y="665" width="780" height="240" rx="18" class="panel"/>
<text x="390" y="705" font-family="sans-serif" font-weight="700" font-size="24" fill="#102b4e">Borniers utilisés par Trigger V3</text>
<g class="small">
<text x="395" y="745">D23/GPIO23 → BTS7960 RPWM</text><text x="395" y="780">D22/GPIO22 → OLED SCL</text><text x="395" y="815">D21/GPIO21 → OLED SDA</text><text x="395" y="850">D27/GPIO27 → Buzzer</text><text x="395" y="885">D13/GPIO13 → Trigger</text>
<text x="760" y="745">D5/GPIO5 → BTS7960 LPWM</text><text x="760" y="780">TX2/GPIO17 → Rumble</text><text x="760" y="815">RX2/GPIO16 → WS2812</text><text x="760" y="850">D4/GPIO4 → PROFILE</text><text x="760" y="885">3V3/GND → OLED + masses</text>
</g>
<text x="50" y="945" class="warn">IMPORTANT : ne jamais mapper un bornier d'après son alignement visuel avec la broche ESP32 voisine.</text>
</svg>