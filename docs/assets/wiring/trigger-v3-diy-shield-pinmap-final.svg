<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>
  .title{font:700 34px sans-serif;fill:#102b4e}.sub{font:20px sans-serif;fill:#555}.h{font:700 22px sans-serif;fill:#fff}.t{font:18px monospace;fill:#111}.small{font:16px sans-serif;fill:#333}.warn{font:700 18px sans-serif;fill:#8a4b00}.ok{font:700 18px sans-serif;fill:#155b2a}
  .green{fill:#23864a}.orange{fill:#d56a14}.panel{fill:#f7fafc;stroke:#8aa6c1;stroke-width:2}
</style>
<rect width="1500" height="980" fill="white"/>
<text x="50" y="55" class="title">Trigger V3 — final DIY shield pin map</text>
<text x="50" y="88" class="sub">Final controls: GPIO13 TRIGGER • GPIO14 PROFILE/MODE • GPIO4 UNUSED • USB orientation: bottom</text>

<rect x="390" y="155" width="720" height="480" rx="24" fill="#202733" stroke="#557" stroke-width="4"/>
<text x="650" y="360" font-family="sans-serif" font-weight="700" font-size="42" fill="white">ESP32 DEVKIT</text>
<text x="690" y="405" font-family="sans-serif" font-size="24" fill="#cfd7e3">USB at bottom</text>
<rect x="675" y="565" width="150" height="55" rx="10" fill="#888"/><text x="714" y="601" font-family="sans-serif" font-weight="700" font-size="20" fill="white">USB</text>

<text x="390" y="125" font-family="sans-serif" font-weight="700" font-size="20" fill="#1768ac">TOP ROW — left → right</text>
<g transform="translate(300,135)">
  <rect width="900" height="85" rx="12" class="panel"/>
  <g class="t">
    <text x="20" y="32">1 D35</text><text x="20" y="58">GPIO35</text>
    <text x="110" y="32">2 D34</text><text x="110" y="58">GPIO34</text>
    <text x="200" y="32">3 VN</text><text x="200" y="58">GPIO39</text>
    <text x="290" y="32">4 VP</text><text x="290" y="58">GPIO36</text>
    <text x="380" y="45">5 EN</text>
    <text x="460" y="32">6 D23</text><text x="460" y="58">GPIO23</text>
    <text x="550" y="32">7 D22</text><text x="550" y="58">GPIO22</text>
    <text x="640" y="32">8 TX0</text><text x="640" y="58">GPIO1</text>
    <text x="730" y="32">9 RX0</text><text x="730" y="58">GPIO3</text>
    <text x="810" y="32">10 D21</text><text x="810" y="58">GPIO21</text>
  </g>
</g>

<rect x="35" y="180" width="300" height="600" rx="16" class="panel"/>
<rect x="35" y="180" width="300" height="48" rx="16" class="green"/><text x="58" y="212" class="h">LEFT SIDE — top → bottom</text>
<g class="t">
<text x="65" y="265">1  D32 / GPIO32</text><text x="65" y="315">2  D33 / GPIO33</text><text x="65" y="365">3  D25 / GPIO25</text><text x="65" y="415">4  D26 / GPIO26</text><text x="65" y="465">5  D27 / GPIO27</text><text x="65" y="515">6  D14 / GPIO14</text><text x="65" y="565">7  D12 / GPIO12</text><text x="65" y="615">8  D13 / GPIO13</text><text x="65" y="665">9  GND</text><text x="65" y="715">10 VIN / 5V</text>
</g>

<rect x="1165" y="180" width="300" height="600" rx="16" class="panel"/>
<rect x="1165" y="180" width="300" height="48" rx="16" class="orange"/><text x="1188" y="212" class="h">RIGHT SIDE — top → bottom</text>
<g class="t">
<text x="1195" y="265">1  D19 / GPIO19</text><text x="1195" y="315">2  D18 / GPIO18</text><text x="1195" y="365">3  D5 / GPIO5</text><text x="1195" y="415">4  TX2 / GPIO17</text><text x="1195" y="465">5  RX2 / GPIO16</text><text x="1195" y="515">6  D4 / GPIO4</text><text x="1195" y="565">7  D2 / GPIO2</text><text x="1195" y="615">8  D15 / GPIO15</text><text x="1195" y="665">9  GND</text><text x="1195" y="715">10 3V3</text>
</g>

<rect x="350" y="665" width="800" height="250" rx="18" class="panel"/>
<text x="380" y="705" font-family="sans-serif" font-weight="700" font-size="24" fill="#102b4e">Trigger V3 connections</text>
<g class="small">
<text x="385" y="745">D23 / GPIO23 → BTS7960 RPWM</text><text x="385" y="780">D22 / GPIO22 → OLED SCL</text><text x="385" y="815">D21 / GPIO21 → OLED SDA</text><text x="385" y="850">D27 / GPIO27 → Buzzer</text><text x="385" y="885">D13 / GPIO13 → TRIGGER</text>
<text x="780" y="745">D5 / GPIO5 → BTS7960 LPWM</text><text x="780" y="780">TX2 / GPIO17 → Rumble PWM</text><text x="780" y="815">RX2 / GPIO16 → WS2812</text><text x="780" y="850">D14 / GPIO14 → PROFILE / MODE</text><text x="780" y="885">D4 / GPIO4 → UNUSED / FREE</text>
</g>
<text x="50" y="942" class="ok">OLED VCC → external regulated 5 V buck OUT. Do NOT use the ESP32 3V3 terminal for OLED VCC on the validated prototype.</text>
<text x="50" y="970" class="warn">Do not infer a terminal GPIO from visual alignment with the ESP32 header; use the mapping above.</text>
</svg>
